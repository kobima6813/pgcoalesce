; benchmark / correctness instance: trust auth (local test only), plaintext to the local server
[pgcoalesce]
listen_addr = 127.0.0.1:56600
server_addr = 127.0.0.1:55433
; passthrough goes to PgBouncer (transaction pool), as in the v2 benchmark
