[pgcoalesce]
listen_addr = 127.0.0.1:56611
server_addr = 127.0.0.1:55433
upstream_addr = 127.0.0.1:55433
server_tls_sslmode = verify-full
server_tls_ca_file = /workspace/coalesce/certs/ca.crt
server_tls_server_name = localhost
client_tls_sslmode = allow
client_tls_cert_file = /workspace/coalesce/certs/proxy.crt
client_tls_key_file = /workspace/coalesce/certs/proxy.key
auth_type = scram-sha-256
auth_file = /workspace/coalesce/conf3/userlist.txt
auth_user = auth_reader
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgcoalesce.get_auth($1)
window = 2ms
lanes = 4
server_lifetime = 600
template_ttl = 60
metrics_addr = 127.0.0.1:56711
pprof = on
