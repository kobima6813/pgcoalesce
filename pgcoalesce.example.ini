[pgcoalesce]
; clients connect here (PgBouncer-compatible port)
listen_addr = 0.0.0.0:6432
; Postgres used for coalesced batches
server_addr = db.internal:5432
; everything that is not coalesced is relayed here (Postgres or PgBouncer in session mode)
upstream_addr = db.internal:5432
server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgcoalesce/ca.crt
server_tls_server_name = db.internal
client_tls_sslmode = require
client_tls_cert_file = /etc/pgcoalesce/tls.crt
client_tls_key_file = /etc/pgcoalesce/tls.key
; scram-sha-256 | md5 ; userlist.txt uses the PgBouncer format ("user" "SCRAM-SHA-256$...")
auth_type = scram-sha-256
auth_file = /etc/pgcoalesce/userlist.txt
; optional: look up unknown users through a SECURITY DEFINER function, like PgBouncer
auth_user = pgcoalesce_auth
auth_query = SELECT usename, passwd FROM pgcoalesce.get_auth($1)
; coalescing
; longest time a lookup waits for partners before its batch is sent
window = 2ms
; adaptive window: hold a lookup only if at least this many more lookups of the same query shape are
; expected within `window` (estimated from the last 32 arrivals); otherwise send it at once, so quiet
; periods pay no added latency. 0 = always hold for the full window.
min_expected = 1
; a merged batch running longer than this is canceled (CancelRequest) and each of its requests is re-run
; on its own client session, so one slow plan or lock wait cannot hold every client of the batch.
; Batches that fail with statement_timeout, lock_timeout or a deadlock are re-run the same way. 0 = off.
batch_timeout = 500ms
lanes = 4
max_batch = 1000
; PostgREST/Supabase transaction-template coalescing
tx_coalesce = on
server_lifetime = 600
template_ttl = 60
; every distinct session configuration (user, database, startup options, session-level SETs such as a
; per-tenant search_path) gets its own engine holding `lanes` server connections.
; Coalescing therefore uses at most about max_engines x lanes server connections; size it against max_connections.
max_engines = 32
; close an engine's server connections after this long without any client using it
engine_idle_timeout = 60
shutdown_timeout = 30
; /metrics, /stats and POST /admin/reload are unauthenticated: keep this on loopback or a private
; interface and let your scraper reach it there (do not expose it publicly)
metrics_addr = 127.0.0.1:9187
pprof = off
